server {
    listen 80;
    server_name _;
    index index.php index.html;
    root /var/www/public;

    error_log  /var/log/nginx/error.log;
    # era access.blade.php.log: residuo di un find/replace globale sbagliato
    access_log /var/log/nginx/access.log;

    charset utf-8;

    # allineato a upload_max_filesize/post_max_size in php/local.ini
    client_max_body_size 40M;

    # DNS interno di Docker. Serve per la fastcgi_pass qui sotto.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Con `fastcgi_pass app:9000;` nginx risolve l'host una volta sola
        # all'avvio: al primo riavvio del container app cambia l'IP e il sito
        # risponde 502 finche' non si riavvia anche nginx. Passando per una
        # variabile, la risoluzione avviene a runtime e segue il container.
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # la generazione dei PDF su esami lunghi supera i 60s di default
        fastcgi_read_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
