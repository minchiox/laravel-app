name: Tests

on:
  push:
    # Il branch di default e' 'main': con 'master' qui, la suite non faceva
    # da gate su nessun push al ramo principale, solo sulle pull request.
    branches:
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      # Solo 8.4: composer.lock ha risolto pacchetti Symfony 8.1.x che
      # richiedono PHP >=8.4.1 (vedi commit "Fix: PHP 8.4 come minimo
      # richiesto"), quindi 8.3 non installa piu' nonostante il Dockerfile
      # avesse gia' scelto 8.4 come runtime di riferimento.
      matrix:
        php: [8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: vendor/bin/phpunit
