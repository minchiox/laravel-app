# Ambiente di sviluppo MEXAM.
#
#   docker compose up -d --build          app su http://localhost:8088
#   docker compose --profile dev up node  Vite in HMR su :5273
#                                         phpMyAdmin su :8181
#
# Le credenziali arrivano da .env (prima erano root/root hardcoded qui dentro).
#
# Nessun `container_name`: fissarlo impedisce a VS Code Dev Containers di
# ricreare i container sotto il proprio progetto compose, e la rebuild resta
# appesa a ritentare invece di fallire. I servizi si raggiungono comunque per
# nome di servizio (nginx punta ad `app:9000`).

name: mexam

services:

  app:
    build:
      context: .
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: mexam/app:dev
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      # node_modules resta nel container: contiene binari compilati per Linux
      # che non devono mescolarsi con quelli dell'host.
      # vendor/ invece resta sul bind mount, cosi' l'IDE puo' indicizzarlo.
      - /var/www/node_modules
    environment:
      MEXAM_AUTO_SETUP: ${MEXAM_AUTO_SETUP:-true}
      APP_PORT: ${APP_PORT:-8088}
    depends_on:
      db:
        # Senza questa condizione il primo `migrate` falliva a caso perche'
        # MySQL non aveva ancora finito di inizializzarsi.
        condition: service_healthy
    networks: [mexam]

  webserver:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d/:/etc/nginx/conf.d/:ro
    depends_on: [app]
    networks: [mexam]

  db:
    # mysql:5.7.22 era EOL da ottobre 2023
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${DB_PORT_HOST:-33061}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mexam}
      MYSQL_USER: ${DB_USERNAME:-mexam}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/mexam.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [mexam]

  # Vite in watch mode. Non parte di default: l'app funziona con gli asset
  # gia' compilati, questo serve solo mentre si lavora sul frontend.
  node:
    # Allineata al NODE_VERSION del Dockerfile: vite 8 (Step F1) richiede
    # Node ^20.19 o >=22.12, e 20 e' gia' EOL.
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      # host e container sulla stessa porta: l'HMR del browser si collega
      # all'indirizzo che Vite scrive in public/hot, quindi le due devono
      # coincidere.
      - "${VITE_PORT:-5273}:${VITE_PORT:-5273}"
    environment:
      VITE_PORT: ${VITE_PORT:-5273}
    command: sh -c "npm install && npm run dev"
    profiles: [dev]
    networks: [mexam]

  # Interfaccia di amministrazione del database.
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8181}:80"
    environment:
      # la chiave era scritta `-PMA_ARBITRARY: 1`, quindi ignorata
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-mexam}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 40M
    depends_on:
      db:
        condition: service_healthy
    networks: [mexam]

networks:
  mexam:
    driver: bridge

volumes:
  dbdata:
    driver: local
